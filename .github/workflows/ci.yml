name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  docker:
    name: Imagem Docker + smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: resolveai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name resolveai -p 3004:3004 resolveai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3004/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3004/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3004/ | grep -q 'ResolveAI'
          curl -fsS -X POST http://127.0.0.1:3004/api/suggest \
            -H 'Content-Type: application/json' -d '{"ticketId":1}' | grep -q '"needsReview":true'
          test "$(docker inspect --format '{{.Config.User}}' resolveai)" = "app"
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' resolveai)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' resolveai | grep -q healthy
      - name: Logs do container
        if: failure()
        run: docker logs resolveai
