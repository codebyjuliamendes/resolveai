# Uso: `uv run alembic upgrade head` (a URL vem de DATABASE_URL/DATABASE_PATH).
# Na aplicação as migrações rodam automaticamente no start (AUTO_MIGRATE=true).
[alembic]
script_location = resolveai:migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
