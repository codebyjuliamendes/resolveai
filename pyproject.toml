[project]
name = "resolveai"
version = "2.0.0"
description = "Central de atendimento com busca na base de conhecimento e sugestões de resposta ligadas às fontes consultadas."
readme = "README.md"
authors = [
    { name = "Júlia Mendes", email = "juliamendesazz@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
resolveai = "resolveai.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL", "PT", "RET", "ASYNC", "DTZ", "PTH",
]
ignore = [
    "PLR0913",  # parâmetros de rota/settings
    "PLR2004",  # limites de validação são explícitos e testados
    "RUF001",   # texto pt-BR usa caracteres tipográficos
    "RUF002",
    "RUF003",
    "SIM905",   # listas de stopwords legíveis com str.split()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # O TestClient do Starlette ainda usa httpx 0.x; o aviso não afeta os testes.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
